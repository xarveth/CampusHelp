# CampusHelp — Spring Boot configuration
# Create the database first:  mysql -u root -p < database/schema.sql
# or:  CREATE DATABASE campushelp CHARACTER SET utf8mb4;

spring.application.name=campushelp

# --- MySQL datasource (override with environment variables in production) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campushelp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

# --- JWT (set JWT_SECRET as an environment variable; the default below is for local dev only) ---
app.jwt.secret=${JWT_SECRET:CampusHelpLocalDevSecretKeyChangeThisInProduction0123456789abcdef}
app.jwt.expiration-ms=86400000

# --- CORS (comma-separated origins; override with CORS_ALLOWED_ORIGINS in production) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Complaint photo uploads (override with UPLOAD_DIR in production) ---
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
